<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiji Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>🌤 Fiji Weather App</h1>
    <p>Real-time weather updates</p>
  </header>

  <main>

    <!-- SEARCH -->
    <section class="search" aria-label="Search weather">
      <input id="cityInput" type="text" placeholder="Enter city" aria-label="City name">
      <button id="searchBtn">Search</button>
    </section>

    <!-- LOADING -->
    <section class="loading hidden" aria-live="polite">
      ⏳ Loading weather...
    </section>

    <!-- ERROR -->
    <section class="error hidden" role="alert"></section>

    <!-- WEATHER RESULT -->
    <section class="weather-card hidden" aria-label="Weather result">

      <article>
        <h2 id="cityName">City</h2>

        <img id="weatherIcon" src="" alt="Weather icon">

        <p id="temp">0°C</p>

        <p id="description">Weather description</p>

        <p id="humidity">💧 --%</p>
      </article>

    </section>

  </main>

  <footer>
    <p>© 2026 Fiji Weather App</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
