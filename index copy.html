<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiji Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🌤 Fiji Weather App</h1>
    <p>Search any city to get live weather updates</p>
  </header>

  <main>

    <!-- SEARCH -->
    <section class="search-section">
      <input id="cityInput" type="text" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </section>

    <!-- LOADING -->
    <div class="loading hidden">⏳ Loading...</div>

    <!-- ERROR -->
    <div class="error hidden"></div>

    <!-- WEATHER CARD -->
    <section class="weather-card hidden">

      <h2 id="cityName">City</h2>

      <img id="weatherIcon" src="" alt="Weather icon">

      <h3 id="temp">0°C</h3>

      <p id="description">Weather description</p>

      <!-- ✅ NEW: humidity (optional but good) -->
      <p id="humidity">💧 --%</p>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
