<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiji Weather App</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>🌤 Fiji Weather Dashboard</h1>
    <p>Real-Time Weather Updates Across Fiji</p>
  </header>

  <!-- MAIN -->
  <main>

    <!-- SEARCH -->
    <div class="search-box">
      <input id="cityInput" type="text" placeholder="Enter city name"/>
      <button id="searchBtn">Search</button>
    </div>

    <!-- LOADING -->
    <div class="loading hidden">⏳ Loading...</div>

    <!-- ERROR -->
    <div class="error hidden"></div>

    <!-- WEATHER CARD -->
    <div class="weather-card hidden">
      <h2 id="cityName">City</h2>

     

      <h3 id="temp">0°C</h3>

      <p id="description">Weather</p>

      <p id="humidity">💧 --%</p>
    </div>

  </main>

</body>
</html>
