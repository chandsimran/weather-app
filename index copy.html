<!DOCTYPE html>
<html>

<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Weather App</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Weather</a>
        <a href="#">About</a>
    </nav>

    <main>

        <section>
            <h2>Search Weather</h2>

            <label for="city">City Name:</label>

            <input type="text" id="city" placeholder="Enter city">

            <button>Search</button>
        </section>

        <section>
            <h2>Current Weather</h2>

            <article>
                <h3>Suva</h3>

                <p>Temperature: 28°C</p>

                <p>Condition: Sunny</p>
            </article>
        </section>

        <aside>
            <h2>Weather Tip</h2>

            <p>Carry an umbrella during rainy weather.</p>
        </aside>

    </main>

    <footer>
        <p>© 2026 Weather App</p>
    </footer>

</body>

</html>
